specVersion: 0.0.6
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AMMFactory
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: AMMFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pair
      abis:
        - name: AMMFactory
          file: ../artifacts/src/amm/AMMFactory.sol/AMMFactory.json
        - name: AMMPair
          file: ../artifacts/src/amm/AMMPair.sol/AMMPair.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,indexed address,bytes32,bool)
          handler: handlePairCreated
      file: ./src/mapping.ts
  - kind: ethereum
    name: LendingPool
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LendingPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LoanPosition
      abis:
        - name: LendingPool
          file: ../artifacts/src/lending/LendingPool.sol/LendingPool.json
      eventHandlers:
        - event: CollateralDeposited(indexed address,uint256)
          handler: handleCollateralDeposited
        - event: CollateralWithdrawn(indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: Borrowed(indexed address,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed address,indexed address,uint256,uint256)
          handler: handleLiquidated
      file: ./src/mapping.ts
  - kind: ethereum
    name: YieldVault
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: YieldVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultPosition
        - VaultActivity
      abis:
        - name: YieldVault
          file: ../artifacts/src/vault/YieldVault.sol/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
      file: ./src/mapping.ts
  - kind: ethereum
    name: Governor
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: SuperAppGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GovernanceProposal
      abis:
        - name: SuperAppGovernor
          file: ../artifacts/src/governance/SuperAppGovernor.sol/SuperAppGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
      file: ./src/mapping.ts
templates:
  - kind: ethereum/contract
    name: AMMPair
    network: arbitrum-sepolia
    source:
      abi: AMMPair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
      abis:
        - name: AMMPair
          file: ../artifacts/src/amm/AMMPair.sol/AMMPair.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
      file: ./src/mapping.ts
